<div class="movie-grid" *ngIf="movies$ | async as movies">
  <a class="movie-card" *ngFor="let movie of movies" [routerLink]="['/movie', movie.id]">
    <img *ngIf="movie.poster_path" [src]="imageUrl + movie.poster_path" [alt]="movie.title" />
    <p>{{ movie.title }}</p>
  </a>
  <p *ngIf="movies.length === 0" class="empty">Aucun film trouvé.</p>
</div>
